<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="420" fill="#ffffff"/>

<text x="40" y="40" font-size="12" fill="#555">Core 0</text>
<line x1="100" y1="36" x2="600" y2="36" stroke="#999" stroke-width="1" opacity="0.4"/>

<rect x="100" y="50" width="90" height="40" rx="6" fill="#e6f1fb" stroke="#378ADD" stroke-width="1"/>
<text x="145" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c447c">Serial</text>
<text x="145" y="80" text-anchor="middle" font-size="11" fill="#185fa5">0-2s</text>

<rect x="200" y="50" width="100" height="40" rx="6" fill="#e6f1fb" stroke="#378ADD" stroke-width="1"/>
<text x="250" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c447c">LittleFS</text>
<text x="250" y="80" text-anchor="middle" font-size="11" fill="#185fa5">mount + config</text>

<rect x="310" y="50" width="110" height="40" rx="6" fill="#e6f1fb" stroke="#378ADD" stroke-width="1"/>
<text x="365" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c447c">WiFi</text>
<text x="365" y="80" text-anchor="middle" font-size="11" fill="#185fa5">STA or AP, ~7s</text>

<rect x="430" y="50" width="110" height="40" rx="6" fill="#e6f1fb" stroke="#378ADD" stroke-width="1"/>
<text x="485" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c447c">Web server</text>
<text x="485" y="80" text-anchor="middle" font-size="11" fill="#185fa5">begin()</text>

<line x1="190" y1="70" x2="200" y2="70" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="300" y1="70" x2="310" y2="70" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="420" y1="70" x2="430" y2="70" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="100" y="120" width="440" height="50" rx="8" fill="#e1f5ee" stroke="#1D9E75" stroke-width="1"/>
<text x="320" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">SEN66 init</text>
<text x="320" y="155" text-anchor="middle" font-size="11" fill="#0f6e56">I2C scan, reset, startContinuousMeasurement, fan clean 10s</text>
<path d="M540 90 L540 105 L320 105 L320 120" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="100" y="200" width="440" height="44" rx="8" fill="#faece7" stroke="#D85A30" stroke-width="1"/>
<text x="320" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#712b13">FIFO push 0xAA55AA55 &#8594; core 1 released</text>
<line x1="320" y1="170" x2="320" y2="200" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

<text x="40" y="290" font-size="12" fill="#555">Core 1</text>
<line x1="100" y1="286" x2="600" y2="286" stroke="#999" stroke-width="1" opacity="0.4"/>

<rect x="100" y="300" width="140" height="44" rx="8" fill="#faeeda" stroke="#BA7517" stroke-width="1"/>
<text x="170" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#412402">fifo.pop()</text>
<text x="170" y="335" text-anchor="middle" font-size="11" fill="#854f0b">blocks until release</text>

<rect x="260" y="300" width="150" height="44" rx="8" fill="#faeeda" stroke="#BA7517" stroke-width="1"/>
<text x="335" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#412402">SPI1 pins + begin</text>
<text x="335" y="335" text-anchor="middle" font-size="11" fill="#854f0b">setRX/TX/SCK, begin(false)</text>

<rect x="430" y="300" width="150" height="44" rx="8" fill="#faeeda" stroke="#BA7517" stroke-width="1"/>
<text x="505" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#412402">radio.begin()</text>
<text x="505" y="335" text-anchor="middle" font-size="11" fill="#854f0b">SX1262 + applyFreq/SF/pwr</text>

<line x1="240" y1="322" x2="260" y2="322" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="410" y1="322" x2="430" y2="322" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M320 244 L170 300" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="100" y="374" width="480" height="36" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
<text x="340" y="396" text-anchor="middle" font-size="12" fill="#444441">loop() / loop1() &#8212; sensor 1Hz, web client, LoRa stream every interval</text>

<line x1="320" y1="244" x2="320" y2="360" stroke="#555" stroke-width="1" opacity="0.4" fill="none"/>
<path d="M320 360 L340 374" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

</svg>
